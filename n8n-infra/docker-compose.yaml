services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: n8n_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
      PGTZ: ${TZ}
    ports:
      - "15009:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - n8n_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  n8n:
    build:
      context: ./n8n
      dockerfile: Dockerfile
    container_name: n8n_app
    restart: unless-stopped
    ports:
      - "15010:5678"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_BASIC_AUTH_ACTIVE: true
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_RUNNERS_ENABLED: true
      N8N_BLOCK_ENV_ACCESS_IN_NODE: false
      N8N_PYTHON_PIP_MODULES: boto3 pandas openpyxl SQLAlchemy psycopg2-binary pymysql
      N8N_PYTHON_PATH: /usr/bin/python3

      WEBHOOK_URL: http://localhost:15010
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_LOG_LEVEL: info
      N8N_METRICS: true
      NODE_FUNCTION_ALLOW_EXTERNAL: "*"
      NODE_FUNCTION_ALLOW_BUILTIN: "*"

      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_custom_nodes:/home/node/.n8n/custom
      - ./workflows:/home/node/.n8n/workflows
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - n8n_network

  redis:
    image: redis/redis-stack:latest
    container_name: n8n_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "15011:8001"
    volumes:
      - redis_data:/data
    environment:
      TZ: ${TZ}
    networks:
      - n8n_network

  adminer:
    image: adminer:latest
    container_name: n8n_adminer
    restart: unless-stopped
    ports:
      - "15012:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      TZ: ${TZ}
    depends_on:
      - postgres
    networks:
      - n8n_network

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Console
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - TZ=${TZ}
    volumes:
      - minio_data:/data
    networks:
      - n8n_network

  minio-init:
    build:
      context: ./minio
      dockerfile: Dockerfile
    container_name: minio_init
    depends_on:
      - minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=${S3_BUCKET}
      - N8N_USER=${N8N_USER}
      - N8N_PASSWORD=${N8N_PASSWORD}
      - N8N_ACCESS_KEY=${N8N_ACCESS_KEY}
      - N8N_SECRET_KEY=${N8N_SECRET_KEY}
    restart: on-failure:3
    networks:
      - n8n_network


networks:
  n8n_network:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  n8n_custom_nodes:
  redis_data:
  minio_data: