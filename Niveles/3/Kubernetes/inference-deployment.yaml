apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: inference
  name: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: inference
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: inference
    spec:
      containers:
        - image: cristiandiaz13/mlops-puj:inference
          name: inference
          ports:
            - containerPort: 8602
              protocol: TCP
      restartPolicy: Always
